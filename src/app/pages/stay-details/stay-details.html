<section class="details-page">
  @if (stay) {
    <img
      [src]="stay.imageUrl"
      [alt]="stay.title"
      class="details-image"
    />

    <div class="details-content">
      <h1>{{ stay.title }}</h1>

      <p class="location">
        {{ stay.location }}
      </p>

      <p class="description">
        {{ stay.description }}
      </p>

      <div class="info">
        <span>⭐ {{ stay.rating }}</span>
        <span>👥 {{ stay.guests }} guests</span>
      </div>

      @if (stay.superhost) {
        <p class="superhost">
          SUPERHOST
        </p>
      }

      <p class="price">
        <strong>{{ stay.price | currency:'EUR':'symbol':'1.0-0' }}</strong>
        / night
      </p>
    </div>
  } @else {
    <h1>Stay not found</h1>
    <p>The stay you are looking for does not exist.</p>
  }
</section>
