<header class="page-header">
  <h1>Nestly</h1>
  <p>Find your perfect stay.</p>

  <button
    type="button"
    (click)="toggleSuperhostFilter()"
  >
    {{ showSuperhostOnly() ? 'Show all stays' : 'Show Superhost stays' }}
  </button>
</header>

<main class="stays-grid">
  @if (filteredStays.length > 0) {
    @for (stay of filteredStays; track stay.id) {
      <app-stay-card
        [stay]="stay"
        [isFavorite]="favoriteIds().includes(stay.id)"
        (favorite)="onFavorite($event)"
      />
    }
  } @else {
    <div class="empty-state">
      <h2>No stays found</h2>
      <p>Try changing your filter.</p>
    </div>
  }
</main>
